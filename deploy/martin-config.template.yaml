cache_size_mb: 2048

postgres:
  connection_string: '${SIG_DATABASE_URL}'
  auto_publish: false
  pool_size: 10
  tables:
    agua:
      schema: gota
      table: agua_2d
      srid: 32719
      geometry_column: geom
      properties:
        aguaid: int4
        aguatipoid: int4
        sectorid: int4
        diametro: numeric
    alcantarillado:
      schema: gota
      table: alcantarillado_2d
      srid: 32719
      geometry_column: geom
      properties:
        alcantarilladoid: int4
        codigo: varchar
        alcantarilladotipoid: int4
        materialid: int4
        primaria: bool
        sectorid: int4
        distritoid: int4
    buzones:
      schema: sig
      table: buzones
      srid: 32719
      geometry_column: geom
      properties:
        buzonid: int4
        codigo: varchar
        sectorid: int4
        distritoid: int4
    cajaagua:
      schema: sig
      table: cajaagua
      srid: 32719
      geometry_column: geom
      properties:
        cajaaguaid: int4
        inscripcion: varchar
        sectorid: int4
        distritoid: int4
    cajadesague:
      schema: sig
      table: cajadesague
      srid: 32719
      geometry_column: geom
      properties:
        cajadesagueid: int4
        inscripcion: varchar
        sectorid: int4
        distritoid: int4
    cajaaguaconexion:
      schema: sig
      table: cajaaguaconexion
      srid: 32719
      geometry_column: geom
      properties:
        cajaaguaid: int4
        aguaid: int4
        sectorid: int4
    cajadesagueconexion:
      schema: sig
      table: cajadesagueconexion
      srid: 32719
      geometry_column: geom
      properties:
        cajadesagueid: int4
        alcantarilladoid: int4
        sectorid: int4
    manzanas:
      schema: sig
      table: manzanas
      srid: 32719
      geometry_column: geom
      properties:
        manzanaid: int4
        manzana: varchar
        sectorid: int4
        distritoid: int4
    lotes:
      schema: sig
      table: lotes
      srid: 32719
      geometry_column: geom
      properties:
        loteid: int4
        manzanaid: int4
        sectorid: int4
        distritoid: int4
    sectores:
      schema: sig
      table: sectores
      srid: 32719
      geometry_column: geom
      properties:
        sectorid: int4
    accesorios:
      schema: sig
      table: accesorios
      srid: 32719
      geometry_column: geom
      properties:
        accesorioid: int4
        accesoriotipoid: int4
        sectorid: int4
        distritoid: int4
    alcantarillado_flujo:
      schema: sig
      table: mv_alcantarilladoflujo
      srid: 32719
      geometry_column: geom
      properties:
        primaria: bool
        sectorid: int4
