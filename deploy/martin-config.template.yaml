# Plantilla — NO se monta directo en el contenedor. Martin no soporta `${VAR}` dentro
# de su propio config.yaml (verificado en vivo: falla el parseo de connection_string
# con una variable sin resolver). El script de deploy la resuelve con `envsubst` antes
# de montarla: `envsubst < martin-config.template.yaml > martin-config.yaml`.
#
# Whitelist explícita de tablas de `sig` (bd_conhydra) — nunca `auto_publish: true`.
# `sig` tiene otros schemas (adm, geoportal) con datos de usuarios/sesiones que NO deben
# quedar expuestos como tiles públicos.
#
# Capas activas en CAPA_LAYER_IDS (MapView.web.tsx):
#   PREDIO       → manzanas, lotes
#   ALCANTARILLADO → alcantarillado, cajadesagueconexion, cajadesague, buzones
#   AGUA         → agua, cajaaguaconexion, cajaagua
#
# `sectores` no es un toggle de CAPA_LAYER_IDS: se resalta (línea gruesa + color por
# sectorid) según la selección de UBICACIÓN en el sidebar (ver ubicacionStore +
# MapView.web.tsx — filtro dinámico por sectorid, no un layer on/off fijo).
#
# `sectorid` está en todas las properties de abajo (incluyendo agua/cajaaguaconexion/
# cajadesagueconexion) para que, al marcar un sector en UBICACIÓN, MapView.web.tsx
# pueda filtrar TODAS las capas de catastro a ese sector, no solo el polígono.
#
# Estructura (schema/table/srid/geometry_column) verificada en vivo contra bd_conhydra
# real con `martin --save-config` — no es una plantilla adivinada.

postgres:
  connection_string: '${SIG_DATABASE_URL}'
  auto_publish: false
  pool_size: 10
  tables:
    agua:
      schema: sig
      table: agua
      srid: 32719
      geometry_column: geom
      properties:
        aguatipoid: int4
        sectorid: int4
    alcantarillado:
      schema: sig
      table: alcantarillado
      srid: 32719
      geometry_column: geom
      properties:
        codigo: varchar
        alcantarilladotipoid: int4
        materialid: int4
        primaria: bool
        sectorid: int4
        distritoid: int4
    buzones:
      schema: sig
      table: buzones
      srid: 32719
      geometry_column: geom
      properties:
        codigo: varchar
        sectorid: int4
        distritoid: int4
    cajaagua:
      schema: sig
      table: cajaagua
      srid: 32719
      geometry_column: geom
      properties:
        inscripcion: varchar
        sectorid: int4
        distritoid: int4
    cajadesague:
      schema: sig
      table: cajadesague
      srid: 32719
      geometry_column: geom
      properties:
        inscripcion: varchar
        sectorid: int4
        distritoid: int4
    cajaaguaconexion:
      schema: sig
      table: cajaaguaconexion
      srid: 32719
      geometry_column: geom
      properties:
        cajaaguaid: int4
        aguaid: int4
        sectorid: int4
    cajadesagueconexion:
      schema: sig
      table: cajadesagueconexion
      srid: 32719
      geometry_column: geom
      properties:
        cajadesagueid: int4
        alcantarilladoid: int4
        sectorid: int4
    manzanas:
      schema: sig
      table: manzanas
      srid: 32719
      geometry_column: geom
      properties:
        manzanaid: int4
        manzana: varchar
        sectorid: int4
        distritoid: int4
    lotes:
      schema: sig
      table: lotes
      srid: 32719
      geometry_column: geom
      properties:
        loteid: int4
        manzanaid: int4
        sectorid: int4
        distritoid: int4
    sectores:
      schema: sig
      table: sectores
      srid: 32719
      geometry_column: geom
      properties:
        sectorid: int4
    alcantarillado_flujo:
      # Vista materializada (Spec: mv_alcantarillado_flujo) — orienta cada tramo según
      # el sentido real del flujo y ya trae `geom_flecha`: un triángulo en el punto
      # medio del tramo, orientado hacia el sentido de flujo (NULL si no hay cotas
      # válidas para calcularlo, ~20% de los tramos). Publicamos geom_flecha, no geom:
      # la línea en sí ya se ve con alcantarillado-primaria/secundaria — lo nuevo acá
      # es la flecha de dirección.
      schema: sig
      table: mv_alcantarillado_flujo
      srid: 32719
      geometry_column: geom_flecha
      properties:
        primaria: bool
        sectorid: int4
