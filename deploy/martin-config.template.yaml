# Plantilla — NO se monta directo en el contenedor. Martin no soporta `${VAR}` dentro
# de su propio config.yaml (verificado en vivo: falla el parseo de connection_string
# con una variable sin resolver). El script de deploy la resuelve con `envsubst` antes
# de montarla: `envsubst < martin-config.template.yaml > martin-config.yaml`.
#
# Whitelist explícita de tablas de `sig` (bd_conhydra) — nunca `auto_publish: true`.
# `sig` tiene otros schemas (adm, geoportal) con datos de usuarios/sesiones que NO deben
# quedar expuestos como tiles públicos.
#
# Capas activas en CAPA_LAYER_IDS (MapView.web.tsx):
#   PREDIO       → manzanas, lotes
#   ALCANTARILLADO → alcantarillado, cajadesagueconexion, cajadesague, buzones
#   AGUA         → agua, cajaaguaconexion, cajaagua
#
# `sectores` no es un toggle de CAPA_LAYER_IDS: se resalta (línea gruesa + color por
# sectorid) según la selección de UBICACIÓN en el sidebar (ver ubicacionStore +
# MapView.web.tsx — filtro dinámico por sectorid, no un layer on/off fijo).
#
# `sectorid` está en todas las properties de abajo (incluyendo agua/cajaaguaconexion/
# cajadesagueconexion) para que, al marcar un sector en UBICACIÓN, MapView.web.tsx
# pueda filtrar TODAS las capas de catastro a ese sector, no solo el polígono.
#
# Estructura (schema/table/srid/geometry_column) verificada en vivo contra bd_conhydra
# real con `martin --save-config` — no es una plantilla adivinada.

# Cache global de tiles ya generadas (default de Martin: 256 MB). Subido a 2 GB
# porque al cambiar de sector el filtro por sectorid se aplica en el cliente:
# la tile completa igual se descarga y regenera desde Postgres, y con 10 sources
# activas es el cuello de botella. Con 2 GB entra practicamente todo el catastro
# de Chiclayo a los zooms usables (16-19), y al re-visitar un sector la tile sale
# de RAM. Ver referencia: https://maplibre.org/martin/config-file.html#caching
cache_size_mb: 2048

postgres:
  connection_string: '${SIG_DATABASE_URL}'
  auto_publish: false
  pool_size: 10
  tables:
    agua:
      schema: sig
      table: agua
      srid: 32719
      geometry_column: geom
      properties:
        aguatipoid: int4
        sectorid: int4
    alcantarillado:
      schema: sig
      table: alcantarillado
      srid: 32719
      geometry_column: geom
      properties:
        codigo: varchar
        alcantarilladotipoid: int4
        materialid: int4
        primaria: bool
        sectorid: int4
        distritoid: int4
    buzones:
      schema: sig
      table: buzones
      srid: 32719
      geometry_column: geom
      properties:
        codigo: varchar
        sectorid: int4
        distritoid: int4
    cajaagua:
      schema: sig
      table: cajaagua
      srid: 32719
      geometry_column: geom
      properties:
        inscripcion: varchar
        sectorid: int4
        distritoid: int4
    cajadesague:
      schema: sig
      table: cajadesague
      srid: 32719
      geometry_column: geom
      properties:
        inscripcion: varchar
        sectorid: int4
        distritoid: int4
    cajaaguaconexion:
      schema: sig
      table: cajaaguaconexion
      srid: 32719
      geometry_column: geom
      properties:
        cajaaguaid: int4
        aguaid: int4
        sectorid: int4
    cajadesagueconexion:
      schema: sig
      table: cajadesagueconexion
      srid: 32719
      geometry_column: geom
      properties:
        cajadesagueid: int4
        alcantarilladoid: int4
        sectorid: int4
    manzanas:
      schema: sig
      table: manzanas
      srid: 32719
      geometry_column: geom
      properties:
        manzanaid: int4
        manzana: varchar
        sectorid: int4
        distritoid: int4
    lotes:
      schema: sig
      table: lotes
      srid: 32719
      geometry_column: geom
      properties:
        loteid: int4
        manzanaid: int4
        sectorid: int4
        distritoid: int4
    sectores:
      schema: sig
      table: sectores
      srid: 32719
      geometry_column: geom
      properties:
        sectorid: int4
    alcantarillado_flujo:
      # Vista materializada `mv_alcantarilladoflujo` (sin guion bajo, nombre real en
      # bd_conhydra actual — el Spec original era mv_alcantarillado_flujo con guion).
      # Orienta cada tramo según el sentido real del flujo. La columna geom es un
      # polígono/triángulo en el punto medio del tramo (NULL si no hay cotas válidas
      # para calcular el flujo, ~20% de los tramos).
      schema: sig
      table: mv_alcantarilladoflujo
      srid: 32719
      geometry_column: geom
      properties:
        primaria: bool
        sectorid: int4
