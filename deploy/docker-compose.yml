services:
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/ivanedac/epsel-movil:latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
      - martin
    networks: [gota]

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/ivanedac/epsel-backend:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
    networks: [gota]

  redis:
    image: redis:7-alpine
    container_name: gota-redis
    restart: unless-stopped
    volumes:
      - gota_redis_data:/data
    networks: [gota]

  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: gota-martin
    restart: unless-stopped
    command: ["--config", "/config/martin-config.yaml", "--listen-addresses", "0.0.0.0:3000"]
    volumes:
      - ./martin-config.yaml:/config/martin-config.yaml:ro
    networks: [gota]

networks:
  gota:
    driver: bridge

volumes:
  gota_redis_data:
