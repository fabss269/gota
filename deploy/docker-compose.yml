services:
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/ivanedac/epsel-movil:latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
      - martin
    networks: [gota]

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/ivanedac/epsel-backend:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      # Ingest DANA (2026-08-04) — dana-mock mientras DANA no da acceso real a su
      # API (ver dana_mock/ y app/modules/incidencias/dana_ingest.py). Nombre de
      # servicio interno (dana-mock:8100), no localhost — corre en la misma red
      # `gota` que backend.
      DANA_API_BASE_URL: ${DANA_API_BASE_URL:-http://dana-mock:8100}
      DANA_POLL_INTERVAL_SECONDS: ${DANA_POLL_INTERVAL_SECONDS:-10}
      DANA_POLL_OVERLAP_SECONDS: ${DANA_POLL_OVERLAP_SECONDS:-10}
    depends_on:
      redis:
        condition: service_started
    networks: [gota]

  dana-mock:
    image: ${DANA_MOCK_IMAGE:-ghcr.io/ivanedac/epsel-dana-mock:latest}
    restart: unless-stopped
    networks: [gota]

  redis:
    image: redis:7-alpine
    container_name: gota-redis
    restart: unless-stopped
    volumes:
      - gota_redis_data:/data
    networks: [gota]

  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: gota-martin
    restart: unless-stopped
    # --cache-expiry: sin esto el cache de tiles de Martin no tiene invalidación
    # ligada a cambios de datos (confirmado en vivo 2026-08-07 con curl: mismo
    # etag/bytes antes y después de un UPDATE en sig.agua) — un edit de
    # diámetro/material vía PATCH /red/elemento/... no se refleja en el mapa
    # hasta que el tile expira. No existe como key del YAML (solo CLI flag).
    command: ["--config", "/config/martin-config.yaml", "--listen-addresses", "0.0.0.0:3000", "--cache-expiry", "60s"]
    volumes:
      - ./martin-config.yaml:/config/martin-config.yaml:ro
    # host.docker.internal no se resuelve por defecto en Docker Engine (Linux) —
    # solo en Docker Desktop. Sin esto Martin no puede conectar a Postgres si la
    # connection_string apunta a host.docker.internal (confirmado en vivo
    # 2026-08-07: "failed to lookup address information: Name or service not
    # known").
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [gota]

networks:
  gota:
    driver: bridge

volumes:
  gota_redis_data:
