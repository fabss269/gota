# Producción — este archivo vive también en el servidor (~/gota-backend-deploy/,
# ver .github/workflows/deploy.yml). La BD (bd_conhydra, esquemas `gota`+`sig`) es
# externa (servidor Postgres de EPSEL, IP LAN) — no hay contenedor `postgres` propio.
# Único puerto publicado: `frontend` (nginx sirve la SPA y hace de proxy a
# `/api` → backend y `/tiles` → martin) — backend/martin/redis solo son alcanzables
# dentro de la red `gota`, nunca desde afuera.
#
# `martin-config.yaml` (no `.template.yaml`) se genera en el servidor con `envsubst`
# antes de este `up` — Martin no soporta `${VAR}` en su propio config (verificado).

services:
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/ivanedac/epsel-movil:latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
      - martin
    networks: [gota]

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/ivanedac/epsel-backend:latest}
    restart: unless-stopped
    environment:
      PROPIA_DB_URL: ${PROPIA_DB_URL}
      PROPIA_DB_SCHEMA: ${PROPIA_DB_SCHEMA:-gota}
      SIG_DB_HOST: ${SIG_DB_HOST}
      SIG_DB_PORT: ${SIG_DB_PORT:-5432}
      SIG_DB_NAME: ${SIG_DB_NAME:-bd_conhydra}
      SIG_DB_USER: ${SIG_DB_USER}
      SIG_DB_PASSWORD: ${SIG_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES_SECONDS: ${JWT_ACCESS_EXPIRES_SECONDS:-3600}
      JWT_REFRESH_EXPIRES_SECONDS: ${JWT_REFRESH_EXPIRES_SECONDS:-2592000}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
    networks: [gota]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - gota_redis_data:/data
    networks: [gota]

  martin:
    image: ghcr.io/maplibre/martin:latest
    restart: unless-stopped
    command: ["--config", "/config/martin-config.yaml", "--listen-addresses", "0.0.0.0:3000"]
    volumes:
      - ./martin-config.yaml:/config/martin-config.yaml:ro
    networks: [gota]

networks:
  gota:
    driver: bridge

volumes:
  gota_redis_data:
