services:
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/ivanedac/epsel-movil:latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
      - martin
    networks: [gota]

  postgres:
    # postgis/postgis, no postgres liso — sig.* usa geometry/geography (PostGIS
    # 3.4.x, misma versión que se viene usando en local, ver deploy/
    # DESPLIEGUE_LOCAL_TUNEL.md). Decisión 2026-08-10: la BD deja de ser externa
    # (antes 172.16.5.222, servidor EPSEL) y pasa a vivir en este mismo VPS/
    # docker-compose — ya no hace falta ninguna conectividad de red especial
    # hacia afuera para que backend/martin le hablen.
    image: postgis/postgis:16-3.4-alpine
    container_name: gota-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-bd_conhydra}
    volumes:
      - gota_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [gota]

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/ivanedac/epsel-backend:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [gota]

  redis:
    image: redis:7-alpine
    container_name: gota-redis
    restart: unless-stopped
    volumes:
      - gota_redis_data:/data
    networks: [gota]

  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: gota-martin
    restart: unless-stopped
    # --cache-expiry: sin esto el cache de tiles de Martin no tiene invalidación
    # ligada a cambios de datos (confirmado en vivo 2026-08-07 con curl: mismo
    # etag/bytes antes y después de un UPDATE en sig.agua) — un edit de
    # diámetro/material vía PATCH /red/elemento/... no se refleja en el mapa
    # hasta que el tile expira. No existe como key del YAML (solo CLI flag).
    command: ["--config", "/config/martin-config.yaml", "--listen-addresses", "0.0.0.0:3000", "--cache-expiry", "60s"]
    volumes:
      - ./martin-config.yaml:/config/martin-config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [gota]

networks:
  gota:
    driver: bridge

volumes:
  gota_redis_data:
  gota_postgres_data:
