name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/ivanedac/epsel-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar llave SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copiar archivos de deploy al servidor
        run: |
          scp -i ~/.ssh/deploy_key -P ${{ secrets.DEPLOY_PORT }} \
            deploy/docker-compose.yml deploy/martin-config.template.yaml vp_gota_create.ddl \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Desplegar (pull + up)
        env:
          BACKEND_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "BACKEND_IMAGE=$(printf '%q' "$BACKEND_IMAGE") \
             GHCR_TOKEN=$(printf '%q' "$GHCR_TOKEN") \
             GHCR_ACTOR=$(printf '%q' "$GHCR_ACTOR") \
             DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH") \
             bash -s" <<'REMOTE'
            set -euo pipefail
            cd "$DEPLOY_PATH"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            DEPLOY_IMAGE="$BACKEND_IMAGE"
            set -a
            source .env
            set +a
            # El .env del servidor puede traer su propio BACKEND_IMAGE (default :latest,
            # ver deploy/.env.example) — este deploy siempre usa el tag del commit actual,
            # nunca :latest, para saber exactamente qué imagen quedó corriendo.
            export BACKEND_IMAGE="$DEPLOY_IMAGE"

            envsubst < martin-config.template.yaml > martin-config.yaml

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          REMOTE

      - name: Limpiar llave SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
