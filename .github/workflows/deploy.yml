name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/ivanedac/epsel-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Corre directo en el Windows Server de producción (self-hosted runner, sin SSH —
  # ver deploy/WINDOWS_RUNNER_SETUP.md). DEPLOY_PATH es una repo variable (no
  # secreto: es solo una ruta local, ej. C:\epsel-deploy) que debe apuntar a la MISMA
  # carpeta que usa el deploy de EPSEL-MOVIL, porque ahí vive el docker-compose.yml
  # compartido y el .env real con las credenciales de producción (nunca en git).
  deploy:
    needs: build-and-push
    runs-on: [self-hosted, Windows]
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copiar archivos de deploy a la carpeta persistente
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ vars.DEPLOY_PATH }}" | Out-Null
          Copy-Item deploy\docker-compose.yml, deploy\martin-config.template.yaml, `
            deploy\render-martin-config.ps1, vp_gota_create.ddl `
            -Destination "${{ vars.DEPLOY_PATH }}" -Force

      - name: Desplegar (pull + up)
        shell: pwsh
        working-directory: ${{ vars.DEPLOY_PATH }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          $env:GHCR_TOKEN | docker login ghcr.io -u $env:GHCR_ACTOR --password-stdin

          .\render-martin-config.ps1

          # Igual que antes (vía SSH): siempre el tag del commit actual, nunca
          # :latest, para saber exactamente qué imagen quedó corriendo. docker
          # compose usa el .env de esta carpeta para el resto de variables; una
          # variable ya presente en el proceso (como esta) tiene prioridad sobre
          # el valor por default de .env.
          $env:BACKEND_IMAGE = "${{ env.IMAGE }}:${{ github.sha }}"

          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
