name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/ivanedac/epsel-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Corre directo en el VPS Contabo (self-hosted runner Linux, sin SSH desde
  # GitHub — el runner se conecta DE SALIDA, ver deploy/LINUX_RUNNER_SETUP.md).
  # DEPLOY_PATH es una repo variable (no secreto: es solo una ruta local, ej.
  # /opt/epsel-deploy) que debe apuntar a la MISMA carpeta que usa el deploy de
  # EPSEL-MOVIL, porque ahí vive el docker-compose.yml compartido (Postgres +
  # Redis + Martin + backend + frontend, un solo stack) y el .env real con las
  # credenciales de producción (nunca en git).
  deploy:
    needs: build-and-push
    runs-on: [self-hosted, Linux]
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copiar archivos de deploy a la carpeta persistente
        run: |
          mkdir -p "${{ vars.DEPLOY_PATH }}"
          cp deploy/docker-compose.yml deploy/martin-config.template.yaml \
            "${{ vars.DEPLOY_PATH }}/"

      - name: Renderizar martin-config.yaml desde el template (envsubst)
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: |
          set -a
          source .env
          set +a
          envsubst < martin-config.template.yaml > martin-config.yaml

      - name: Desplegar (pull + up)
        working-directory: ${{ vars.DEPLOY_PATH }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

          # Igual que antes: siempre el tag del commit actual, nunca :latest, para
          # saber exactamente qué imagen quedó corriendo. docker compose usa el
          # .env de esta carpeta para el resto de variables; una variable ya
          # presente en el proceso (como esta) tiene prioridad sobre el .env.
          export BACKEND_IMAGE="${{ env.IMAGE }}:${{ github.sha }}"

          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
