name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/ivanedac/epsel-movil

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Mismo Windows Server que gota-backend (self-hosted runner registrado en este
  # repo por separado — GitHub no permite compartir runners entre repos de una
  # cuenta personal, solo en organizaciones). No copia nada: docker-compose.yml
  # vive en DEPLOY_PATH, puesto ahí por el deploy de gota-backend — este job solo
  # actualiza la imagen del servicio `frontend`. DEPLOY_PATH debe apuntar a la
  # MISMA ruta configurada como repo variable en gota-backend.
  deploy:
    needs: build-and-push
    runs-on: [self-hosted, Windows]
    permissions:
      packages: read
    steps:
      - name: Desplegar (pull + up solo frontend)
        shell: pwsh
        working-directory: ${{ vars.DEPLOY_PATH }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          $env:GHCR_TOKEN | docker login ghcr.io -u $env:GHCR_ACTOR --password-stdin

          $env:FRONTEND_IMAGE = "${{ env.IMAGE }}:${{ github.sha }}"

          docker compose pull frontend
          docker compose up -d --no-deps frontend
          docker image prune -f
