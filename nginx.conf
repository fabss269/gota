# Sirve la SPA estática (expo export -p web) y hace de único punto de entrada
# público: el navegador solo habla con este origen, nginx reenvía internamente a
# backend/martin (que no publican puerto propio) por la red docker `gota`.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # DNS embebido de Docker — resuelve backend/martin en cada request, no una sola
    # vez al arrancar. Sin esto, nginx usa el hostname literal en `proxy_pass` como
    # upstream estático resuelto al boot: si ese contenedor no existe todavía en la
    # red (orden de arranque, o -como en pruebas locales- directamente no está
    # levantado), nginx ni siquiera arranca ("host not found in upstream"). Con
    # `resolver` + variable, arranca igual y solo esa ruta puntual falla (502/504)
    # hasta que el contenedor destino esté disponible.
    resolver 127.0.0.11 valid=10s;

    gzip on;
    gzip_types text/css application/javascript application/json font/woff2;

    # Backend (FastAPI) — los routers no tienen prefijo /api, hay que quitarlo
    # antes de reenviar (ver app/main.py en gota-backend).
    location /api/ {
        # El "set" va ANTES del "rewrite ... break": break corta el resto de
        # directivas del módulo rewrite en este location (incluido cualquier "set"
        # posterior), dejando la variable sin inicializar ("invalid URL prefix").
        set $backend_upstream http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Martin (tiles) — mismo prefijo a quitar antes de reenviar.
    location /tiles/ {
        set $martin_upstream http://martin:3000;
        rewrite ^/tiles/(.*)$ /$1 break;
        proxy_pass $martin_upstream;
        proxy_set_header Host $host;
    }

    # Assets con hash en el nombre (expo export): cacheables agresivamente.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA (expo-router): sirve el archivo/página exacta si existe, si no cae al
    # index.html raíz para que el ruteo cliente resuelva la URL.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
