# Sirve la SPA estática (expo export -p web) y hace de único punto de entrada
# público: el navegador solo habla con este origen, nginx reenvía internamente a
# backend/martin (que no publican puerto propio) por la red docker `gota`.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json font/woff2;

    # Backend (FastAPI) — los routers no tienen prefijo /api, hay que quitarlo
    # antes de reenviar (ver app/main.py en gota-backend).
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Martin (tiles) — mismo prefijo a quitar antes de reenviar.
    location /tiles/ {
        rewrite ^/tiles/(.*)$ /$1 break;
        proxy_pass http://martin:3000;
        proxy_set_header Host $host;
    }

    # Assets con hash en el nombre (expo export): cacheables agresivamente.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA (expo-router): sirve el archivo/página exacta si existe, si no cae al
    # index.html raíz para que el ruteo cliente resuelva la URL.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
